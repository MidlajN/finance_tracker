name: Android Release

on:
  workflow_dispatch:

jobs:
  android-release:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      FINANCE_ANDROID_KEYSTORE_BASE64: ${{ secrets.FINANCE_ANDROID_KEYSTORE_BASE64 }}
      FINANCE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FINANCE_ANDROID_KEYSTORE_PASSWORD }}
      FINANCE_ANDROID_KEY_ALIAS: ${{ secrets.FINANCE_ANDROID_KEY_ALIAS }}
      FINANCE_ANDROID_KEY_PASSWORD: ${{ secrets.FINANCE_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prepare Android upload keystore
        if: env.FINANCE_ANDROID_KEYSTORE_BASE64 != ''
        working-directory: apps/mobile
        run: |
          mkdir -p .release
          printf '%s' "$FINANCE_ANDROID_KEYSTORE_BASE64" | base64 --decode > .release/upload-keystore.jks
          echo "FINANCE_ANDROID_KEYSTORE_FILE=$PWD/.release/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Validate release environment
        run: npm run release:android:check-env

      - name: Generate Android project
        run: npm run mobile:prebuild:android

      - name: Build release app bundle
        run: npm run mobile:android:bundleRelease

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: finance-android-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
